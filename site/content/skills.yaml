# One entry per skill in .claude/skills/. The tab order on the site follows this file.
# role: one line. use: how this project uses it (markdown). examples: concrete moments from the books (markdown).
# cases: training cases (training/NN-*.md) that taught this skill something.

story-seed:
  stage: "0"
  origin: ours
  role: "Grows a one-line premise into material to choose from: premise twists, heroes, what the magic implies, scenes, endings. Then cuts it to novella size."
  use: |
    Runs before the story bible when a book starts as a one-liner (the premises in `books/collection.md`). One step per
    turn, the author picks each time: **premise ladder** (6–10 what-if twists) → **protagonist** (3–4 candidates with
    want / need / wound / lie, checked by character-archetypes) → **magic implications** (who profits, who is hurt,
    cost / limit / counter) → **set pieces, 2–3 endings and the central question** → **novella fit check** (1 magic
    system, 2–4 places, 3–5 characters; the rest goes to *Parked*) → **names by ear** (starts `glossary.md`).

    Output is `seed.md`, which keeps the author's own decisions (*Author said*) apart from Claude's open suggestions
    and the rejected ideas, so the story bible is built only from what the author chose.
  examples: |
    - **Why it exists.** Book 2 changed course halfway with "I want a happy ending". Story-seed asks which ending the
      author wants before there is an outline.
    - **Parked ideas.** Ideas cut for size are kept with a reason, as raw material for later books in the collection.

fantasy-novella:
  stage: "1–5"
  origin: ours
  role: "The hub. Owns the book layout, the pipeline order, sizing and drafting, and says which skill runs each stage."
  use: |
    Every session starts here. It lists `books/`, reads the active book's `status.md` and reports the stage and the
    next step. It sizes the book (default 15k words), keeps the world small (one magic system, 2–4 places, 3–5
    characters who matter) and drafts **one chapter per turn**: read outline, bible, continuity and glossary → write
    `chNN.md` within ±15 % of target → log new facts to `continuity.md` and names to `glossary.md` → run
    avoid-ai-writing in detect mode → update `status.md` → stop.
    - **Proof that each stage ran:** the scripts of stages 6–10 log every run (input and output hashes) to
      `pipeline.log.jsonl`, and `verify.py` checks each stage against that log and the files themselves:
      PASS, STALE, MISSING, FAIL, UNLOGGED, or MANUAL for the judgement stages. A book is done when it passes.

    Its reference `writing-for-the-ear.md` is the checklist that makes these books work as audio: attribute dialogue
    often, keep sentences under ~30 words, never let italics carry meaning, re-orient the listener at every chapter start.
  examples: |
    - **Flat layout, decided by the author.** The first layout had `bible/`, `manuscript/` and `audio/script/`
      subfolders. The author said "there are too many book subfolders", so the rule became *one folder per book, one
      `audio/` folder inside it, nothing else*.
    - **Sizing.** *The One in the Chair* came out at 13 short chapters of ~1,000–1,500 words (~7 min of audio each)
      instead of the default 6–8 long ones, because short chapters suit listening in short sessions.
    - **Continuity log.** Each chapter appended facts such as `ch08 | That night the cushion is COLD for the first time
      in three years`, so later chapters (and the reader test) could check them.

world-rules:
  stage: "1–5"
  origin: ours
  role: "Makes the magic and the world's logic hold: numbered rules stress-tested against the book's law, money and ownership, a reveal ladder, and a rule audit and reader test that check every chapter obeys them."
  use: |
    The hub calls it at five points. **Build** (stage 1) writes the bible's *Rules of the World* as numbered rules and
    puts eight stress-test questions to them: what happens when the magic is given, sold, stolen, pledged or
    inherited; does the effect pass along a chain; when exactly ownership changes; who gets the money; how each
    institution treats it; "why doesn't X just …?"; what feeds it; exceptions. **Ladder** (stage 2) maps which chapter
    shows which rule, so everything the climax uses is shown earlier, in action. **Audit** (each chapter, then the whole
    book) flags contradictions, rules used too early, knowledge slips and loopholes. **Rule reader test** (stage 5): a
    fresh subagent with only the chapters explains each rule back, and anything it gets wrong is a finding. **Revise**
    handles rules that change after drafting.

    `verify.py` shows on the stage 1 line whether a book has numbered rules and a reveal ladder.
  examples: |
    - **Why it exists.** Second-Hand Dragons was finished and narrated before the author said "the logic for how fire
      works or how the Reckoning works isn't clear". Every contradiction was where the magic met the pawn law or the
      money (pledging vs selling, who keeps the price, when ownership passes, a bought flame vs a bought dragon). The
      fix (rules 1–17, a reveal ladder, light edits to all 13 chapters, a cold reader test) became this skill.
    - **Not the first time.** The One in the Chair also needed new afterlife rules for its second edition.

story-structure:
  stage: "2"
  origin: vendored
  role: "Places the landmark beats (Weiland) and checks what each one must do emotionally (Bell's signposts). Map mode before drafting, Audit mode after."
  use: |
    Run in **Map** mode on the story bible to produce the chapter outline: where the Inciting Event, Plot Points,
    Pinch Points, Midpoint and Climax fall as a percentage of the book, and which chapter carries each.
    In a 15k book the Inciting Event lands around 1,800 words (≈ chapter 1–2) and the Midpoint around 7,500.
  examples: |
    - The outline for *The One in the Chair* tags every chapter with its beat and percentage, e.g.
      **1. Intake (~0–7 %)**: *Hook / Disturbance. Care Package (the chair).* and
      **2. New Evidence (~7–15 %)**: *Inciting Event. Closing hook: the letter has no Office stamp.*
    - It forced an "engine" decision before drafting: the supervisor sent the letter, so the panel's condition
      *can't be met honestly*, and Mira has to expose the only person who helped her. See the
      [outline](books/the-one-in-the-chair/making-of/outline.html) (spoilers).

fiction-workshop:
  stage: "1, 4, 5"
  origin: vendored
  role: "Story-bible interview, editor personas (developmental, line, continuity) and the fresh-reader test."
  use: |
    Stage 1 is its question-driven story bible. In editing it supplies the order of passes (developmental →
    character/continuity → line edit). Most valuable is **Stage 3, the fresh-reader test**: a separate subagent with
    no context reads the finished book cold and reports confusion, contradictions and flat spots.
  examples: |
    The fresh reader on *The One in the Chair* found, and the revision fixed:
    - **Two characters called "the archivist"**: the counter woman became "the counter clerk".
    - **Numbers that drifted**: the testimony count was 36, 35 and 32 in different chapters; Inspector Crane's
      "two hundred years" contradicted another chapter.
    - **A death the reader missed**: Mira's own death was never clear; chapter 3 now states it, chapter 10 gives it
      one line: "A wet road, a delivery van, a Tuesday."
    - **A climax that didn't hold**: the legal turn was reworked so "trafficked" means *carried across* and forgery
      is a separate offence Mira confesses to.
    - **Stated morals and spoilers**: lines that explained the theme, and hints in chapters 3 and 6 that gave the
      twist away, were cut.

character-archetypes:
  stage: "1, 4"
  origin: vendored
  role: "Archetype and character-function consults (mentor, shadow, threshold guardian…) for the cast."
  use: |
    Available for character consults during the bible and the character pass of editing. In a novella with
    three to five characters who matter, its main job is checking that each one has a distinct function so no two
    characters do the same work in the story.
  examples: |
    Book 1 didn't need a dedicated consult: the bible already fixed each role (Mira the protagonist, Edmund the
    supervisor as mentor with a secret, Inspector Crane as the institutional antagonist). It stays installed for the
    next books.

prose-mechanics:
  stage: "4"
  origin: vendored
  role: "Line-level audits: echoes, crutch words, filter words, sentence starters, sentence-length variance, dialogue tags, POV and tense consistency."
  use: |
    The line-edit stage. Each audit is a separate reference file and reports findings in a shared format
    (location, technique, severity), so fixes can be checked off.
  examples: |
    The kind of thing it catches, from book 1's edit: repeated words that a listener hears far more than a reader
    sees (*grey*, *cardigan*), and a tic of "Not X." sentence fragments that had crept into several chapters.

avoid-ai-writing:
  stage: "3, 4"
  origin: vendored
  role: "Detects and removes AI writing tells: em-dash overuse, \"tapestry/testament to\", tidy triplets, every scene ending on a reflective one-liner."
  use: |
    Run in **detect** mode on every drafted chapter (step 6 of drafting) and once more over the whole book at the
    end of editing. Generated fiction drifts toward these patterns, and narration makes them worse: a listener hears
    every "It wasn't X. It was Y."
  examples: |
    Fixes in book 1 included trimming "Not X." fragments, cutting scene-ending one-liners that stated the moral, and
    removing stock phrases. The author's own chapter 1 keeps its em dashes: they're part of the voice, and Kokoro
    pauses on them naturally.

manuscript-review:
  stage: "3–5"
  origin: ours
  role: "A review-and-rewrite loop with brakes: an independent reviewer that never edits, an objective gate, an issue ledger and hard caps, so revision converges without rewriting the story."
  use: |
    Runs after each chapter is drafted (**chapter loop**) and once the whole book exists (**book loop**). A fresh
    subagent reviews the chapter against its outline section, the rules, `continuity.md` and the *writing for the ear*
    checklist, and returns at most 12 issues (must / should / nit). Claude, as the writer, fixes them. `gate.py` then checks
    what doesn't need judgement: the word count, the dialogue limits (one- and two-word lines ≤ 1 in 20, clipped lines ≤ 1 in 10)
    and how many words changed. From round 2 on, the reviewer only verifies the fixes and may raise new issues only at must severity.

    The brakes: the outline, rules and continuity are **locked** in the chapter loop (plot and rule issues are queued for the
    book loop). Every issue is recorded in `review.md`, and a closed issue can't be raised again. Each round has a **change
    budget** (25%, then 10% of the words). The chapter loop stops after **3 rounds** and the book loop after 2, and anything
    still open goes to the author. Each chapter's loop ends with `gate.py --close`, and `verify.py` shows stage 4 as PASS
    once every chapter has a passing close.
  examples: |
    - **Why it exists.** Drafting and checking used to be one pass by the same agent, so the edit stage could only ever
      show as MANUAL. The author asked for an independent reviewer and a loop, "mindful about all the review and rewrites
      so we don't end up changing the story forever".
    - **Short dialogue.** On *The Worst Liar in Pennyford* (which already followed the 1-in-7 rule) the new gate flags 4 of 8
      chapters, e.g. ch08 with "Oh," / "Thank you," / "Thirty-one years." The reviewer decides which of them earn their place.
  cases: ["10"]

speech-flow:
  stage: "6"
  origin: ours
  role: "Fixes punctuation and sentence shapes in the manuscript so the text works when heard, before it's converted to a script."
  use: |
    Built after the author heard book 1. A script (`scan.py`) flags candidates: italics with no cue in the words,
    commas before "and" that split one subject's two verbs, bare short questions, dashes that never close, sentences
    over 35 words, runs of six or more commas, semicolons, interrupters without commas. Then a **listening
    read-through** catches what a regex can't: far referents ("find *any*"), contradictions ("ever did, mostly"),
    garden-path sentences. Fixes go into `chNN.md` only after the author approves them.
  examples: |
    First run, on chapter 1: 12 candidates, 7 kept plus 1 from the read-through. The worst was a garden path:
    *"…teaching herself to hear it as* I know, love. I know.*"* The italics vanish in audio, so a listener hears
    "hear it as I know…". Fix: *"…to hear it say: I know, love. I know."*
  cases: ["02", "03", "04", "05"]

narration-prep:
  stage: "7"
  origin: ours
  role: "Converts each chapter to a Kokoro script: strips markdown, spells out numbers, adds pauses, and writes names as phonemes."
  use: |
    Claude does the conversion itself (it needs judgement), using `g2p.py` to test pronunciations. The glossary
    comes first: every invented name gets a "sounds like" from the author and a phoneme string. Scene breaks
    become `[pause 1.5]`, headings become a spoken title plus `[pause 1.0]`, and long paragraphs are split so the
    render cache stays granular. Rules learned from the author's examples live in its *Learned rules* section.
  examples: |
    - **Names.** Kokoro's American voice said Mira as "MY-uh-ruh" (`mˈIəɹə`) and Elin as "ih-LIN". The glossary
      fixes them to MEER-uh (`mˈiɹə`) and EL-in (`ˈɛlɪn`), written in the script as `[Mira](/mˈiɹə/)`.
    - **Short questions** (case 01): "Can I?" ended flat. Fix: stress the key word and double the question mark,
      `"[Can](+2) I??"`. A tag or beat after the line doesn't fix it (`"Why?" It came out sharper…` is still
      unstressed), so `prep.py` marks every short question that has no main stress, tag or not.
    - **Question before a beat** (case 09): with the markup it was better but not great. Voiced as its own
      paragraph, with the beat as the next one, it sounds most like a question.
  cases: ["01", "09"]

kokoro-narrate:
  stage: "8"
  origin: ours
  role: "Renders scripts to speech with Kokoro-82M, locally on the CPU, with a per-paragraph cache."
  use: |
    Reads the `narration:` block in `book.yaml` (voice, speed, pause between paragraphs, optional character
    voices). Each paragraph's audio is cached by a hash of voice, speed and text, so editing one paragraph
    re-renders only that paragraph. A full 15k-word book takes about an hour (≈1.7× real time on a laptop CPU).
  examples: |
    - **Voice audition.** Chapter 1 was rendered in several voices for the author to pick. Grades from Kokoro's
      voice card: af_heart A, af_bella A−, bf_emma B−, bm_george and bm_fable C. The author chose **af_heart** at
      speed 0.95, now the house default.
    - **Training renders.** `--script` renders a single test file, which is how every before/after in
      [Improvements](improvements.html) was made.

listen-check:
  stage: "9"
  origin: ours
  cases: ["06"]
  role: "Automatic listener: transcribes each chapter with Whisper and compares it with the script, checks the pace of every paragraph and the stress of short lines."
  use: |
    Runs after narration, before assembling. Whisper (`base.en`, local, about 6× real time, so ~16 minutes per book)
    transcribes the audio, and the transcript is aligned word by word with the script. Skipped, swapped or garbled
    words come back as timestamps. Two cheap checks run alongside it: words per second per paragraph (rushed or
    garbled audio), and Kokoro's own phonemes for bare short lines and for short questions, even with a tag (no main stress means
    a flat ending).
    Known Whisper noise is filtered out: digits for number words, words echoed at its 30-second window joins,
    dropped "the", and spelling variants. Each finding is double-checked with the slower `small.en` model before the
    author is asked to listen, and confirmed problems become training cases with the clip already cut.
  examples: |
    - **First run, chapter 1:** 8 raw flags. Three were numbers ("31" for "thirty-one"), and five were doubled words
      ("someone someone"). Re-transcribing short clips with both models showed each word only once, so the doubling
      was Whisper, not Kokoro. Both filters went into the script; chapter 1 now reports **0 issues**.
    - **Whole book, first run:** about 90 raw flags. Sound-based filters (homophones, British spelling, names compared
      by phonemes) and the automatic second opinion from `small.en` brought it down to **2 word flags in 92 minutes**,
      plus a few pace and stress notes. One was real: in chapter 6, "A wall." is heard as **"A while."** It became
      training case 06, the first problem the listener found that nobody had reported.
    - **Limit:** Whisper prefers familiar spellings, so it confirms that names aren't badly wrong, not that the
      stress is perfect. Names are still checked by ear once, in narration-prep.
    - **No pitch check:** tested and dropped. af_heart ends a question and a statement with the same falling
      pitch (within 1 semitone in 25 of 26 test pairs), so a "does it rise?" check would flag every question.

audiobook-assemble:
  stage: "10"
  origin: ours
  role: "Masters chapter WAVs to −19 LUFS, writes per-chapter MP3s and one chaptered .m4b with cover and metadata."
  use: |
    Per chapter: 1 s lead-in, 2 s tail, two-pass `loudnorm` to −19 LUFS integrated / −3 dBTP (ACX-style), mono
    44.1 kHz, MP3. Then everything is concatenated into one AAC `.m4b` with chapter markers taken from the real
    durations, the cover as attached picture, and title/author/narrator tags. The m4b is what goes to the phone
    (BookPlayer via Google Drive) and to this site.
  examples: |
    *The One in the Chair*: 13 chapters, 92 minutes, −19.4 LUFS integrated. The file carries both chapter formats
    players read (a QuickTime chapter track and Nero `chpl`), so chapters show in BookPlayer and Apple Books.

voice-text:
  stage: "6–10"
  origin: ours
  role: "Stages 6–10 for text that isn't a book in this repo: a doc, notes, story chapters or a video voiceover, voiced from any project with the same rules."
  use: |
    Linked into `~/.claude/skills/` (with the five audio skills), so it works in every Claude Code project.
    `voice.sh new <file> --kind prose|fiction|voiceover` makes a book-shaped work dir `voice/<slug>/` in that project.
    Then the usual stages run on it through the same launcher: `scan` → ear rewrites → `prep` → `narrate` → `listen` →
    `export` → `status`. Nothing is re-implemented. Each command calls the stage's own script, which logs its run as it does for a book.
    - **prose** turns markdown into paragraphs and lists what a listener can't use (tables, code, lists, URLs) for
      Claude to say in words. The dialogue checks are off.
    - **voiceover** gives each `##` scene its own unpadded MP3, plus `timings.json` for the video edit.
    - **Rewrites** go into the work-dir copy, and Claude offers to copy them back to the original.
    - **Lessons** from any project become training cases here, in `training/`, so every project shares one set of rules.
  examples: |
    - **A 200-word survey note** with a table, a code block and a list: three `rewrite:` lines, the table said in one
      sentence, the invented name *Teodric* respelled in the glossary. 1.4 min of audio, −19.4 LUFS, Whisper heard
      both names, every audio stage PASS in `status`.
    - **Same rules, proven.** A chapter of *Second-Hand Dragons* voiced from another folder gives a byte-identical
      script to the book's own `audio/ch03.txt`.
